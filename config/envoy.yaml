# EXPERIMENTAL - route correctness/authentication must be independently tested.
static_resources:
  listeners:
    - name: http
      address:
        socket_address: {address: 0.0.0.0, port_value: 8000}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: api
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/auth/v1/"}
                          route: {cluster: auth, prefix_rewrite: "/"}
                        - match: {prefix: "/rest/v1/"}
                          route: {cluster: rest, prefix_rewrite: "/"}
                        - match: {prefix: "/storage/v1/"}
                          route: {cluster: storage, prefix_rewrite: "/"}
                        - match: {prefix: "/realtime/v1/"}
                          route: {cluster: realtime, prefix_rewrite: "/"}
                        - match: {prefix: "/functions/v1/"}
                          route: {cluster: functions, prefix_rewrite: "/"}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/env.extensions.filters.http.router.v3.Router
  clusters:
    - name: auth
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment: {cluster_name: auth, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: auth, port_value: 9999}}}}]}]}
    - name: rest
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment: {cluster_name: rest, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: rest, port_value: 3000}}}}]}]}
    - name: storage
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment: {cluster_name: storage, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: storage, port_value: 5000}}}}]}]}
    - name: realtime
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment: {cluster_name: realtime, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: realtime, port_value: 4000}}}}]}]}
    - name: functions
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment: {cluster_name: functions, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: functions, port_value: 9000}}}}]}]}
